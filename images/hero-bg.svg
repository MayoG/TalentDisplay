<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="h1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080809"/>
      <stop offset="50%" style="stop-color:#140c10"/>
      <stop offset="100%" style="stop-color:#0a0a0b"/>
    </linearGradient>
    <radialGradient id="h2" cx="50%" cy="32%" r="60%">
      <stop offset="0%" style="stop-color:#5c1a2e;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#0a0a0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="h3" cx="50%" cy="0%" r="75%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.18"/>
      <stop offset="55%" style="stop-color:#0a0a0b;stop-opacity:0"/>
    </radialGradient>
    <!-- Warm rim light from the right (behind portrait) -->
    <radialGradient id="h4" cx="92%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.14"/>
      <stop offset="45%" style="stop-color:#5c1a2e;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0a0a0b;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="h5" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0b;stop-opacity:0.9"/>
      <stop offset="35%" style="stop-color:#0a0a0b;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0a0a0b;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#h1)"/>
  <rect width="1920" height="1080" fill="url(#h2)"/>
  <rect width="1920" height="1080" fill="url(#h3)"/>
  <rect width="1920" height="1080" fill="url(#h4)"/>
  <rect width="1920" height="1080" fill="url(#h5)"/>
  <ellipse cx="200" cy="700" rx="500" ry="200" fill="#c9a962" opacity="0.03"/>
</svg>
